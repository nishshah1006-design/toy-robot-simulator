<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-label="Diagram: main.py sends each line to Simulator, which parses it; malformed lines short-circuit to stderr, valid commands go to Robot; a detail view shows that only PLACE and MOVE pass through Robot's is_on_table gate, which either updates state or silently keeps the previous state.">
  <rect x="0" y="0" width="1200" height="740" fill="#FFFFFF"/>
  <style>
    text{ font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif; fill:#17211D; }
    .mono{ font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace; }
    .title{ font-family:"Archivo","Segoe UI",Helvetica,Arial,sans-serif; font-weight:700; font-size:15px; }
    .sub{ font-size:11px; fill:#4C574F; }
    .lbl{ font-size:11px; }
    .lbl-muted{ font-size:11px; fill:#4C574F; }
    .eyebrow-svg{ font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace; font-size:10px; letter-spacing:0.08em; fill:#4C574F; text-transform:uppercase; }
    .box{ fill:#FFFFFF; stroke:#17211D; stroke-width:1.5; }
    .box-accent{ fill:#DCEDE6; stroke:#1F6F5C; stroke-width:1.75; }
    .frame{ fill:none; stroke:#D8DED6; stroke-width:1.5; stroke-dasharray:3 4; }
    .flow{ stroke:#17211D; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
    .flow-rej{ stroke:#4C574F; stroke-width:1.5; fill:none; stroke-dasharray:5 4; marker-end:url(#arrow); }
    .flow-go{ stroke:#1F6F5C; stroke-width:1.75; fill:none; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#17211D"/>
    </marker>
  </defs>

  <!-- ===== Top pipeline ===== -->
  <rect class="box" x="20" y="70" width="170" height="90"/>
  <text class="eyebrow-svg" x="35" y="90">Input</text>
  <text class="mono lbl" x="35" y="112">test_data/*.txt</text>
  <text class="mono lbl" x="35" y="132">stdin (typed)</text>

  <rect class="box" x="270" y="70" width="160" height="90"/>
  <text class="title" x="285" y="98">main.py</text>
  <text class="sub" x="285" y="118">reads lines,</text>
  <text class="sub" x="285" y="133">prints output</text>

  <rect class="box" x="530" y="70" width="190" height="90"/>
  <text class="title" x="545" y="93">Simulator</text>
  <text class="mono sub" x="545" y="113">parse_line()</text>
  <text class="mono sub" x="545" y="130">execute(command)</text>

  <rect class="box-accent" x="810" y="70" width="170" height="90"/>
  <text class="title" x="825" y="98">Robot</text>
  <text class="mono sub" x="825" y="118">x, y, facing</text>
  <text class="sub" x="825" y="133">(current state)</text>

  <!-- forward arrows -->
  <line class="flow" x1="190" y1="98" x2="266" y2="98"/>
  <text class="mono lbl" x="230" y="90" text-anchor="middle">lines</text>

  <line class="flow" x1="430" y1="98" x2="526" y2="98"/>
  <text class="mono lbl" x="478" y="90" text-anchor="middle">run_line(line)</text>

  <line class="flow" x1="720" y1="98" x2="806" y2="98"/>
  <text class="mono lbl" x="763" y="90" text-anchor="middle">execute(cmd)</text>

  <!-- return arrows -->
  <line class="flow" x1="720" y1="134" x2="434" y2="134" marker-end="url(#arrow)"/>
  <text class="mono lbl-muted" x="478" y="150" text-anchor="middle">REPORT text / None</text>

  <line class="flow" x1="806" y1="134" x2="724" y2="134" marker-end="url(#arrow)"/>
  <text class="mono lbl-muted" x="763" y="150" text-anchor="middle">new state</text>

  <!-- main.py -> stdout -->
  <line class="flow-go" x1="350" y1="160" x2="350" y2="324"/>
  <text class="mono lbl" x="360" y="245">print(output)</text>

  <!-- Simulator -> stderr, malformed line short-circuit -->
  <polyline class="flow-rej" points="600,160 600,200 350,200 350,376"/>
  <text class="mono lbl-muted" x="478" y="193" text-anchor="middle">malformed line &#8594; CommandParseError &#8594; on_error()</text>

  <!-- ===== Output frame ===== -->
  <rect class="frame" x="270" y="300" width="160" height="140"/>
  <text class="eyebrow-svg" x="285" y="317">Output</text>
  <rect class="box" x="282" y="328" width="136" height="42"/>
  <text class="mono lbl" x="292" y="345">stdout</text>
  <text class="sub" x="292" y="360">REPORT text</text>
  <rect class="box" x="282" y="380" width="136" height="42"/>
  <text class="mono lbl" x="292" y="397">stderr</text>
  <text class="sub" x="292" y="412">"Ignored: ..."</text>

  <!-- connector down to inset -->
  <line class="flow-rej" x1="895" y1="160" x2="895" y2="476" stroke-dasharray="2 5"/>
  <text class="mono lbl-muted" x="905" y="330">zoom: PLACE / MOVE only</text>

  <!-- ===== Inset: fall-prevention gate ===== -->
  <rect class="frame" x="680" y="480" width="480" height="220"/>
  <text class="eyebrow-svg" x="700" y="500">Inside Robot &#8212; the fall-prevention gate</text>

  <rect class="box" x="700" y="540" width="120" height="50"/>
  <text class="mono lbl" x="712" y="561" text-anchor="start">PLACE(x,y,f)</text>
  <text class="mono lbl" x="712" y="577" text-anchor="start">/ MOVE</text>

  <polygon class="box-accent" points="905,530 945,565 905,600 865,565"/>
  <text class="lbl" x="905" y="569" text-anchor="middle">?</text>
  <text class="mono lbl-muted" x="905" y="520" text-anchor="middle">Table.is_on_table(x,y)</text>

  <line class="flow-go" x1="820" y1="562" x2="861" y2="565"/>

  <line class="flow-go" x1="945" y1="558" x2="1000" y2="540"/>
  <text class="mono lbl" x="960" y="536">yes</text>
  <rect class="box-accent" x="1000" y="515" width="150" height="46"/>
  <text class="sub" x="1012" y="533">x, y, facing</text>
  <text class="sub" x="1012" y="548">updated</text>

  <line class="flow-rej" x1="905" y1="600" x2="905" y2="618"/>
  <text class="mono lbl-muted" x="915" y="613">no</text>
  <rect class="box" x="800" y="618" width="340" height="46"/>
  <text class="sub" x="812" y="637">previous state kept &#8212;</text>
  <text class="sub" x="812" y="652">nothing printed</text>

  <text class="lbl-muted" x="700" y="690">LEFT / RIGHT skip this gate (Direction.left()/right() always succeeds) &#183; REPORT only reads state, never writes it</text>

  <!-- ===== Legend ===== -->
  <line class="flow" x1="20" y1="705" x2="60" y2="705"/>
  <text class="lbl-muted" x="68" y="709">accepted / valid path</text>
  <line class="flow-rej" x1="20" y1="726" x2="60" y2="726"/>
  <text class="lbl-muted" x="68" y="730">rejected / ignored / error path</text>
</svg>
